<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fristindo Jaya Pump</title>
<style>
  :root{
    --bg:#e6edf5;
    --accent:#0055a6;
    --text:#0055a6;
    --text-dim:#4d7fb0;
    --shadow-light:#ffffff;
    --shadow-dark:#c3ccd9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,-apple-system,sans-serif;min-height:100vh;}
  body{display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px;}
  button{font-family:inherit;}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}

  .raised{background:var(--bg);box-shadow:8px 8px 16px var(--shadow-dark),-8px -8px 16px var(--shadow-light);}
  .raised-sm{background:var(--bg);box-shadow:4px 4px 8px var(--shadow-dark),-4px -4px 8px var(--shadow-light);}
  .pressed{background:var(--bg);box-shadow:inset 4px 4px 8px var(--shadow-dark),inset -4px -4px 8px var(--shadow-light);}

  .view{width:100%;max-width:720px;display:none;}
  .view.show{display:block;}

  /* ================= KATALOG ================= */
  .cat-header{display:flex;align-items:center;gap:14px;padding:18px 22px;border-radius:20px;margin-bottom:22px;}
  .cat-logo-wrap{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:4px;flex-shrink:0;}
  .cat-logo{width:100%;height:100%;border-radius:50%;object-fit:cover;}
  .cat-title{font-size:19px;font-weight:700;letter-spacing:-0.01em;color:var(--accent);overflow-wrap:break-word;}

  .cat-label{font-size:18px;color:var(--text);font-weight:700;margin:0 0 16px 4px;}
  .list{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
  .item{
    display:flex;flex-direction:column;align-items:stretch;gap:14px;width:100%;text-align:center;border:none;border-radius:22px;
    padding:14px 14px 18px;cursor:pointer;color:var(--text);transition:transform .1s ease,box-shadow .15s ease;
  }
  .item:active{transform:scale(.98);box-shadow:inset 4px 4px 8px var(--shadow-dark),inset -4px -4px 8px var(--shadow-light);}
  .avatar{width:100%;aspect-ratio:1/1;border-radius:18px;padding:8px;display:flex;align-items:center;justify-content:center;}
  .avatar img{width:100%;height:100%;border-radius:12px;object-fit:cover;display:block;}
  .avatar .fallback{width:100%;height:100%;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:var(--text-dim);}
  .name{font-size:18px;font-weight:700;line-height:1.3;overflow-wrap:break-word;padding:0 4px;}

  @media (max-width:480px){
    body{padding:16px 12px 40px;}
    .cat-header{padding:14px;margin-bottom:18px;}
    .cat-title{font-size:16px;}
    .cat-logo-wrap{width:50px;height:50px;}
    .cat-label{font-size:17px;}
    .list{gap:14px;}
    .item{padding:10px 10px 14px;border-radius:20px;gap:10px;}
    .name{font-size:16px;}
  }

  /* Pemberitahuan kalau interface pompa belum dimasukkan */
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    padding:14px 22px;border-radius:16px;font-size:14px;font-weight:700;color:var(--accent);max-width:90%;text-align:center;
    transition:opacity .2s ease,transform .2s ease;z-index:20;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ============ INTERFACE POMPA (dari kode kamu) ============ */
  /* Tombol Kembali ke katalog (satu-satunya tambahan) */
  .kembali-wrap{width:100%;margin-bottom:18px;}
  .kembali{
    border:none;border-radius:14px;padding:12px 24px;font-size:14px;font-weight:700;color:var(--accent);cursor:pointer;
    background:var(--bg);box-shadow:4px 4px 8px var(--shadow-dark),-4px -4px 8px var(--shadow-light);
  }
  .kembali:active{box-shadow:inset 3px 3px 6px var(--shadow-dark),inset -3px -3px 6px var(--shadow-light);}

  #detail{color:var(--text);}
  #detail .header{width:100%;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-radius:20px;margin-bottom:22px;}
  #detail .header-left{display:flex;align-items:center;gap:14px;min-width:0;flex:1 1 auto;}
  #detail .header-text{min-width:0;display:flex;flex-direction:column;}
  #detail .logo-wrap{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:4px;flex-shrink:0;}
  #detail .logo{width:100%;height:100%;border-radius:50%;object-fit:cover;}
  #detail .eyebrow{font-size:19px;letter-spacing:-0.01em;color:var(--eyebrow);font-weight:700;white-space:normal;overflow-wrap:break-word;}
  #detail .title{font-size:19px;font-weight:700;letter-spacing:-0.01em;color:var(--text);white-space:normal;overflow-wrap:break-word;}
  #detail .clock{font-variant-numeric:tabular-nums;font-size:12px;color:var(--text-dim);text-align:right;line-height:1.4;padding:10px 14px;border-radius:12px;flex-shrink:0;}
  #detail .clock span{display:block;}
  #detail .clock .time{color:var(--text);font-size:14px;font-weight:700;margin-top:2px;}
  @media (max-width:480px){
    #detail .header{padding:16px;}
    #detail .clock{font-size:11px;padding:8px 12px;}
    #detail .clock .time{font-size:13px;}
    #detail .title,#detail .eyebrow{font-size:17px;}
  }

  #scene3d{position:relative;display:none;width:100%;aspect-ratio:16/9;background:#171c22;}
  #detail .stage{width:100%;border-radius:22px;overflow:hidden;padding:10px;}
  #detail .video-inner{border-radius:16px;overflow:hidden;}
  #detail video{width:100%;display:block;background:#000;aspect-ratio:16/9;}
  #detail .now-playing{display:flex;align-items:center;gap:10px;padding:12px 16px;margin-top:10px;border-radius:12px;font-size:12px;color:var(--text-dim);letter-spacing:0.02em;}
  #detail .now-playing .dot{width:9px;height:9px;border-radius:50%;background:var(--bg);box-shadow:inset 2px 2px 4px var(--shadow-dark),inset -2px -2px 4px var(--shadow-light);flex-shrink:0;}
  #detail .now-playing.active .dot{background:var(--accent);box-shadow:0 0 0 4px var(--glow);}
  #detail .now-playing .label{color:var(--text);font-weight:700;}

  #detail .picker{width:100%;margin-top:26px;}
  #detail .picker-label{font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-dim);font-weight:700;margin:0 0 14px 4px;}
  #detail .btn-grid{display:grid;grid-template-columns:1fr;gap:16px;}
  @media (min-width:600px){ #detail .btn-grid{grid-template-columns:repeat(var(--cols,3),1fr);} }
  #detail .pump-btn{position:relative;text-align:left;border:none;border-radius:18px;padding:18px 20px;cursor:pointer;transition:box-shadow .15s ease,transform .1s ease;color:var(--text);font-family:inherit;}
  #detail .pump-btn:active{transform:scale(.98);}
  #detail .pump-btn.selected{box-shadow:inset 4px 4px 8px var(--shadow-dark),inset -4px -4px 8px var(--shadow-light);}
  #detail .pump-btn.placeholder{cursor:default;opacity:.55;}
  #detail .pump-btn.placeholder:active{transform:none;}
  #detail .pump-name{display:block;font-size:14px;font-weight:700;line-height:1.3;color:var(--text);}
  #detail .pump-time{display:block;font-size:11px;color:var(--text-dim);margin-top:8px;font-variant-numeric:tabular-nums;font-weight:600;}

  #detail .hint{width:100%;margin-top:26px;padding:16px 20px;border-radius:16px;font-size:12px;color:var(--text-dim);line-height:1.6;}
</style>
</head>
<body>

  <!-- ================= KATALOG ================= -->
  <div class="view show" id="catalog">
    <div class="cat-header raised">
      <div class="cat-logo-wrap raised-sm"><img src="logo.png" alt="Logo" class="cat-logo"></div>
      <div class="cat-title">FRISTINDO JAYA PUMP</div>
    </div>
    <div class="cat-label">Pilih pompa</div>
    <div class="list" id="list"></div>
  </div>

  <!-- ================= INTERFACE POMPA ================= -->
  <div class="view" id="detail">
    <div class="kembali-wrap"><button class="kembali" id="kembali">Kembali</button></div>

    <div class="header raised">
      <div class="header-left">
        <div class="logo-wrap raised-sm"><img src="logo.png" alt="Logo" class="logo"></div>
        <div class="header-text">
          <div class="title" id="dTitle"></div>
          <div class="eyebrow" id="dSub"></div>
        </div>
      </div>
      <div class="clock pressed">
        <span id="clockLabel">Diakses</span>
        <span class="time" id="clockTime">--:--:--</span>
      </div>
    </div>

    <div class="stage raised">
      <div class="video-inner">
        <video id="video" controls playsinline></video>
        <!-- Panel animasi 3D (dipakai tombol "3D render") -->
        <div id="scene3d" aria-label="Animasi 3D interaktif. Geser untuk memutar, scroll untuk zoom."></div>
      </div>
      <div class="now-playing pressed" id="nowPlaying"></div>
    </div>

    <div class="picker">
      <div class="picker-label" id="dLabel"></div>
      <div class="btn-grid" id="btnGrid"></div>
    </div>

    <div class="hint pressed" id="dHint"></div>
  </div>

  <div id="toast" class="raised-sm"></div>

<!-- Animasi 3D untuk ADLS. three.js baru dimuat saat tombol "3D render" ditekan -->
<script>
/* Palletizing cell 3D animation. Needs three.js r128 loaded first.

add(BX(1.3,.1,1.3),dark,0,.05,0,robot);add(CY(.62,.3),wh,0,.25,0,robot);
const yaw=new THREE.Group();yaw.position.y=.4;robot.add(yaw);

function place(){cam.position.set(tg.x+o.r*Math.sin(o.az)*Math.cos(o.el),tg.y+o.r*Math.sin(o.el),tg.z+o.r*Math.cos(o.az)*Math.cos(o.el));cam.lookAt(tg)}
const ptr=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);pd=0});
cv.addEventListener('pointerup',e=>ptr.delete(e.pointerId));cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;
 if(ptr.size===1){o.az-=(e.clientX-p[0])*.006;o.el=Math.max(.05,Math.min(1.45,o.el+(e.clientY-p[1])*.006))}
 else{const q=[...ptr.entries()].find(([k])=>k!==e.pointerId)[1];const d0=Math.hypot(p[0]-q[0],p[1]-q[1]),d1=Math.hypot(e.clientX-q[0],e.clientY-q[1]);o.r=Math.max(5,Math.min(24,o.r*d0/d1))}
 ptr.set(e.pointerId,[e.clientX,e.clientY])});
cv.addEventListener('wheel',e=>{e.preventDefault();o.r=Math.max(5,Math.min(24,o.r*(1+e.deltaY*.001)))},{passive:false});
const bs='border:none;border-radius:10px;padding:6px 12px;font:600 12px system-ui,sans-serif;color:#e6ebf0;background:rgba(30,37,45,.85);border:1px solid #38424e;cursor:pointer';
const bar=document.createElement('div');bar.style.cssText='position:absolute;left:10px;bottom:10px;display:flex;gap:8px';container.appendChild(bar);
const pp=document.createElement('button'),rv=document.createElement('button');pp.style.cssText=rv.style.cssText=bs;rv.textContent='Reset view';bar.append(pp,rv);
pp.onclick=()=>{playing=!playing;pp.textContent=playing?'Pause':'Play'};rv.onclick=()=>{o={...home}};pp.textContent=playing?'Pause':'Play';
function size(){const w=container.clientWidth||1,h=container.clientHeight||1;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?55:35;cam.updateProjectionMatrix()}
new ResizeObserver(size).observe(container);size();theme();
let on=false;(function loop(n){requestAnimationFrame(loop);if(!on)return;const dt=(n-last)/1000;last=n;
 if(playing){ph=(ph+dt/16)%1;pose(ph)}
 place();R.render(S,cam)})(performance.now());
return{start(){last=performance.now();on=true;size()},stop(){on=false}};
};

  // ======================================================
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const formatTime = sec => `${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,'0')}`;
  const video = $('video'), nowPlaying = $('nowPlaying'), detail = $('detail');

  // Cari foto dengan beberapa kemungkinan ekstensi
  const EXTS = ['.jpg', '.jpeg', '.png', '.webp', '.JPG', '.JPEG', '.PNG'];
  function loadThumb(src, alt, ok, fail){
    const list = /\.[a-z0-9]{3,4}$/i.test(src) ? [src] : EXTS.map(e => src + e);
    let i = 0;
    const img = new Image();
    img.alt = alt;
    img.onload = () => ok(img);
    img.onerror = () => { i++; if (i < list.length) img.src = encodeURI(list[i]); else fail(); };
    img.src = encodeURI(list[0]);
  }

  // Pemberitahuan singkat
  let toastTimer;
  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }

    const b = document.createElement('button');
    b.className = 'item raised';
    b.innerHTML = `<span class="avatar raised-sm"></span>
                   <span class="name"${p.warna ? ` style="color:${p.warna}"` : ''}>${esc(p.nama)}</span>`;
    const av = b.querySelector('.avatar');
    loadThumb(p.foto, p.nama,
      img => av.appendChild(img),
      () => { av.innerHTML = `<span class="fallback pressed">${esc(p.nama.trim().charAt(0).toUpperCase())}</span>`; });
    b.addEventListener('click', () => {
      if (p.ui) location.hash = 'pompa-' + (i + 1);
      else toast(`Interface ${p.nama} belum dimasukkan`);
    });
    $('list').appendChild(b);
  });

  // ---------- Interface pompa ----------
  let scene3d = null, threeLoading = null;
  function loadThree(){
    if (window.THREE) return Promise.resolve();
    if (!threeLoading) threeLoading = new Promise((ok, fail) => {
      const el = document.createElement('script');
      el.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
      el.onload = ok;
      el.onerror = () => { threeLoading = null; fail(); };
      document.head.appendChild(el);
    });
    return threeLoading;
  }

  // kembali ke tampilan video (menutup panel 3D)
  function leave3d(){
    if (scene3d) scene3d.stop();
    $('scene3d').style.display = 'none';
    video.style.display = '';
  }

  function showPump(i){
    const ui = PUMPS[i].ui;
    const t = ui.tema;
    leave3d();

    detail.style.setProperty('--accent', t.accent);
    detail.style.setProperty('--text', t.text);
    detail.style.setProperty('--text-dim', t.textDim);
    detail.style.setProperty('--eyebrow', t.eyebrow || t.accent);
    detail.style.setProperty('--glow', t.glow);
    detail.style.setProperty('--cols', ui.kolom || 3);

    $('dSub').textContent = ui.sub;
    $('dLabel').textContent = ui.label || LABEL_STD;
    $('clockLabel').textContent = ui.diakses || 'Diakses';
    $('dHint').textContent = ui.hint || HINT_POMPA;

    video.src = ui.video;
    video.load();

    nowPlaying.classList.remove('active');
    nowPlaying.innerHTML = `<span class="dot"></span><span>${esc(ui.intro || INTRO_STD)}</span>`;

    const grid = $('btnGrid');
    grid.innerHTML = '';
    ui.tombol.forEach(pump => {
      const is3d = pump.mode === '3d';
      const btn = document.createElement('button');

      // Tombol kosong: tampil tapi tidak bisa diklik
      if (pump.disabled){
        btn.className = 'pump-btn raised-sm placeholder';
        btn.disabled = true;
        btn.innerHTML = `<span class="pump-name">&nbsp;</span><span class="pump-time">&nbsp;</span>`;
        grid.appendChild(btn);
        return;

      btn.className = 'pump-btn raised-sm';

                       <span class="pump-time">${is3d ? 'tampilan 3D interaktif' : (ui.awalan || 'mulai ') + formatTime(pump.startSeconds)}</span>`;
      btn.addEventListener('click', () => {
        grid.querySelectorAll('.pump-btn').forEach(b => {
          b.classList.remove('selected');
          if (!b.classList.contains('placeholder')) b.classList.add('raised-sm');
        });
        btn.classList.remove('raised-sm');
        btn.classList.add('selected');

        if (is3d){
          video.pause();
          video.style.display = 'none';
          $('scene3d').style.display = 'block';
          loadThree().then(() => {
            if (!scene3d) scene3d = Scene3D($('scene3d'));
            if ($('scene3d').style.display === 'block') scene3d.start();
          }).catch(() => toast('Animasi 3D gagal dimuat (perlu koneksi internet)'));

          leave3d();
          video.currentTime = pump.startSeconds;
          video.play();

        nowPlaying.classList.add('active');
        nowPlaying.innerHTML = `<span class="dot"></span><span>${is3d ? 'Sedang ditampilkan' : 'Sedang diputar'}: <span class="label">${esc(pump.name)}</span></span>`;

      grid.appendChild(btn);
    });

    detail.classList.add('show');
    window.scrollTo(0, 0);
  }

  function showCatalog(){
    video.pause();
    leave3d();
    detail.classList.remove('show');
    $('catalog').classList.add('show');
    window.scrollTo(0, 0);

  // Routing lewat hash: tombol Kembali dan tombol back HP/browser sama-sama ke katalog
  function route(){
    const m = location.hash.match(/^#pompa-(\d+)$/);
    const i = m ? parseInt(m[1], 10) - 1 : -1;
    if (i >= 0 && i < PUMPS.length && PUMPS[i].ui) showPump(i); else showCatalog();
  }
  window.addEventListener('hashchange', route);
  $('kembali').addEventListener('click', () => { location.hash = ''; });
  route();

  // Jam waktu akses (real-time, waktu lokal perangkat)
  function updateClock(){
    $('clockTime').textContent = new Date().toLocaleString('id-ID', {
      day:'2-digit', month:'2-digit', year:'numeric',
      hour:'2-digit', minute:'2-digit', second:'2-digit'
    });
  }
  updateClock();
  setInterval(updateClock, 1000);
